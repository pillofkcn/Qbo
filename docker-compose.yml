# Optional reliability services. NOT required for first boot.
# Lavalink + the bot run natively on Windows (as NSSM services); only enable
# these if you later want the YouTube reliability hardening.
#
#   docker compose up -d yt-cipher
#
# Then uncomment the `remoteCipher` block in lavalink/application.yml and point
# it at http://localhost:8001 (set YT_CIPHER_PASSWORD in your .env).

services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:latest   # verify the tag at build time
    container_name: yt-cipher
    restart: unless-stopped
    environment:
      - API_PASSWORD=${YT_CIPHER_PASSWORD}
    ports:
      - "8001:8001"

  # Spotify token service. Needed because the Spotify app is in Development mode and
  # client credentials can't reach playlist/album/artist endpoints — LavaSrc uses this
  # for an anonymous token (like the web player). Pairs with
  # lavasrc.spotify.customTokenEndpoint: "http://localhost:8080/api/token".
  #
  # NOTE: the DEFAULT deployment runs this NATIVELY as a Windows service (no Docker) via
  # scripts/get-tokener.ps1 + scripts/install-services.ps1. This Docker service is kept
  # only as a fallback if the native Chrome-based tokener misbehaves.
  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    container_name: spotify-tokener
    restart: unless-stopped
    ports:
      - "8080:8080"
