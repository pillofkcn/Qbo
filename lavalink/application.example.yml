# ════════════════════════════════════════════════════════════════════════
#  Lavalink configuration — copy this file to `application.yml` next to
#  Lavalink.jar before first run.  Secrets are read from environment variables
#  (the NSSM service injects them from your .env — see scripts/install-services.ps1).
#
#  ⚠ Plugin versions move fast. Verify the latest at build time:
#     youtube-source : https://github.com/lavalink-devs/youtube-source/releases
#     LavaSrc        : https://github.com/topi314/LavaSrc/releases
#  Verified known-good baseline: October 2026.
#
#  application.yml is not tracked by git: scripts/install-services.ps1 copies this
#  file over it on every run (keeping a .bak-* copy) — re-run it after `git pull`.
# ════════════════════════════════════════════════════════════════════════

server:
  port: 2333
  address: 0.0.0.0          # localhost is fine when the bot is on the same host
  http2:
    enabled: false

lavalink:
  plugins:
    # youtube-source SNAPSHOT from main (commit 2be8e54, 2026-09-17). YouTube now serves many videos only
    # as the muxed itag 18 format: 1.18.1 reads it as a live stream and stops a few seconds in, 1.18.2
    # cuts off the last seconds. Switch back to a release (>= 1.18.3) once one is published.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    # LavaLyrics powers the /lyrics command (with LRCLIB via LavaSrc below).
    # Verify the latest tag at https://github.com/topi314/LavaLyrics/releases
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false        # MUST be false — native YT is deprecated; the plugin handles YT
      soundcloud: true       # no-auth fallback source (scsearch:) — keep ON
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 10000
    youtubePlaylistLoadLimit: 6   # pages of 100
    playerUpdateInterval: 5
    soundcloudSearchEnabled: true
    # ratelimit / proxy block only needed on datacenter IPs — omitted for home hosting

# ── 'plugins' is a ROOT key (NOT under 'lavalink:'). Watch the indentation. ──
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients are tried in order (Layer-1 internal fallback); order follows the upstream README
    # (October 2026). ANDROID_VR needs no player-script cipher, so tracks start sooner and survive
    # cipher breakage. Names change between versions — if Lavalink logs
    # "Failed to resolve <CLIENT> into a Client", fix this list against the README:
    # https://github.com/lavalink-devs/youtube-source#available-clients
    clients:
      - MUSIC            # search only (ytmsearch), never used for playback
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TVHTML5_SIMPLY
    # ── Optional reliability upgrades (leave commented for first boot) ──────
    # OAuth: on first run the log prints a device code; authorise at
    # https://google.com/device with a BURNER Google account, then paste the
    # printed refresh token here.
    # oauth:
    #   enabled: true
    #   refreshToken: "${YT_OAUTH_REFRESH_TOKEN}"
    #   skipInitialization: true
    # poToken — pair with a refresh/generated token if you hit bot checks:
    # pot:
    #   token: "${YT_PO_TOKEN}"
    #   visitorData: "${YT_VISITOR_DATA}"
    # Remote cipher server (recommended hardening) — run via docker-compose:
    # remoteCipher:
    #   url: "http://localhost:8001"
    #   password: "${YT_CIPHER_PASSWORD}"

  lavasrc:
    # Layer-2 cross-source fallback chain. Tried in order until one returns audio.
    providers:
      - "dzisrc:%ISRC%"          # 1. Deezer by ISRC (no-op until arl + key are set)
      - "ytsearch:\"%ISRC%\""    # 2. YouTube exact ISRC match
      - "ytmsearch:%QUERY%"      # 3. YouTube Music (best metadata match)
      - "ytsearch:%QUERY%"       # 4. YouTube search
      - "scsearch:%QUERY%"       # 5. SoundCloud — final no-auth fallback (survives a YT outage)
    sources:
      spotify: true
      applemusic: false
      deezer: false              # set true only after providing arl + masterDecryptionKey
      youtube: true              # enables ytsearch metadata for LavaSearch
      soundcloud: false          # built-in SC source already handles scsearch; keep false here
    lyrics-sources:
      spotify: false
      youtube: false
      lrcLib: true               # free, no-auth lyrics for /lyrics
    spotify:
      # clientId/clientSecret are intentionally LEFT UNSET. With valid client credentials,
      # LavaSrc 4.8.3 resolves playlists via the client-credentials token (getAccessToken(false)),
      # which Spotify 401s for this Development-mode app. Leaving creds unset makes LavaSrc use
      # the ANONYMOUS token (customTokenEndpoint / spotify-tokener) for ALL Spotify resolution —
      # tracks, albums, playlists, artists — which reads public content like the web player.
      # (spsearch is unused; we search via ytmsearch.) To revert: uncomment the two lines below.
      # clientId: "${SPOTIFY_CLIENT_ID}"
      # clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "SK"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      # Resolve playlists/albums/artists via Spotify's PARTNER API (api-partner.spotify.com)
      # first. The anonymous token below belongs to the partner API; the public api.spotify.com/v1
      # endpoint throttles anonymous requests (429). This is what makes playlist loading work.
      preferPartnerApi: true
      # Anonymous token endpoint (spotify-tokener). REQUIRED here: the Spotify app is in
      # Development mode, so client credentials can't load playlists/albums/artists —
      # this routes those through an anonymous (web-player-style) token. Run the
      # spotify-tokener service from docker-compose.yml, then keep this pointed at it.
      customTokenEndpoint: "http://localhost:8080/api/token"
    # deezer:
    #   arl: "${DEEZER_ARL}"
    #   masterDecryptionKey: "${DEEZER_MASTER_KEY}"
    #   formats: ["MP3_320", "MP3_256", "MP3_128"]

logging:
  level:
    root: INFO
    lavalink: INFO
    # Set to DEBUG temporarily to see which YouTube client/format each track uses
    # ("Starting track with URL from client ...", "missing format URL ... SABR response?").
    dev.lavalink.youtube: INFO
  file:
    path: ./logs/
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 25MB
